name: Test and package source (workflow artifact only)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to verify; never attaches files to Releases'
        required: true
        default: master
        type: string

permissions:
  contents: read

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test allowlist packaging without GUI or private fixtures
        run: python -B -m unittest discover -s tests -p test_release_package.py -v
      - name: Build and verify source/docs ZIP
        run: python -B tools/package_source.py --output ORC-Toolkit.zip
      - name: Preserve ZIP only as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORC-Toolkit-source
          path: ORC-Toolkit.zip
